id = "line-level-entry-api"
description = "Line mode grades one line on its own rubric: `entry`, `or_insert` and the deref behind the `*`."
snippet = "rust-005"
mode = "lines"
must_pass = true
tags = ["line-mode"]

# Prompt numbering in line mode follows the asked lines: 1, 3, 4, 5, 6, 8 —
# so the `*counts.entry(..)` line is prompt 5.
[[annotations]]
prompt = 5
text = "entry looks the key up once and or_insert puts 0 in when it is missing; it hands back a mutable reference, and the star dereferences it so += 1 adds one to the count"

[[expect]]
prompt = 5
concept = "rust.hashmap.entry"
verdict = "correct"
[[expect]]
prompt = 5
concept = "rust.deref.assign"
verdict = "correct"
