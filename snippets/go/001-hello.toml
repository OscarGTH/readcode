id = "go-001"
language = "go"
title = "Hello, with a variable in between"
level = 1
intro = "The smallest complete Go program: a package, an import, and one line of output."
code = '''
package main

import "fmt"

func main() {
	name := "ferris"
	fmt.Println("hello,", name)
}
'''

[[blocks]]
lines = [1, 1]
ask = "What does `package main` tell Go about this file?"
concepts = ["go.package.main"]
notes = { "go.package.main" = "A package called `main` is compiled into an executable, and its `func main()` is where the program starts. Any other package name makes a library that cannot be run on its own." }

[[blocks]]
lines = [2, 4]
ask = "Where does the name `fmt` come from? What happens to an import you never use?"
concepts = ["go.import"]
notes = { "go.import" = "The last element of the import path is the name you write: `\"fmt\"` gives `fmt.Println`. An unused import is a compile error in Go, unlike an unused variable-free language." }

[[blocks]]
lines = [5, 8]
ask = "What does `:=` do? Where can you not use it?"
concepts = ["go.short_var"]
notes = { "go.short_var" = "`:=` declares and assigns in one step, taking the type from the right-hand side. It only works inside a function: at package level you must use `var`." }
