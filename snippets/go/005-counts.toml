id = "go-005"
language = "go"
title = "Counting words in a map"
level = 2
intro = "A map built with make, incremented through its index."
code = '''
func wordCount(words []string) map[string]int {
	counts := make(map[string]int)
	for _, word := range words {
		counts[word]++
	}
	return counts
}
'''

[[blocks]]
lines = [1, 1]
ask = "What is the zero value of this map type? What can you do with it?"
concepts = ["go.map.zero"]
notes = { "go.map.zero" = "A map declared but not made is `nil`: reading from it returns zero values and never panics, but writing to it panics. That is why the next line calls `make`." }

[[blocks]]
lines = [2, 2]
ask = "Why `make` here? What would `var counts map[string]int` do?"
concepts = ["go.map.make"]
notes = { "go.map.make" = "`make` allocates the map's internals so it can be written to. `var counts map[string]int` would be nil, and the first `counts[word]++` would panic." }

[[blocks]]
lines = [3, 4]
ask = "This key is new. Where does the first number come from?"
concepts = ["go.map.index", "go.zero.value"]
notes = { "go.map.index" = "Indexing a map with a missing key is not an error: it yields the value type's zero value, so the map is never asked to hold a nil.", "go.zero.value" = "That zero value is `0` for `int`. Go has no uninitialised memory, so this idiom works for every map of numbers or strings." }

[[blocks]]
lines = [5, 7]
ask = "Does the caller get the map, or a copy?"
concepts = ["go.map.reference"]
notes = { "go.map.reference" = "Maps are reference values: the returned map shares the same internals as `counts`, so a change through either name is seen by both. Slices work the same way, arrays and structs do not." }
