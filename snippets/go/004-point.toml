id = "go-004"
language = "go"
title = "A struct and a method on it"
level = 2
intro = "A point with two fields, and a method that measures it."
code = '''
import "math"

type Point struct {
	X, Y float64
}

func (p Point) Dist() float64 {
	return math.Sqrt(p.X*p.X + p.Y*p.Y)
}
'''

[[blocks]]
lines = [1, 2]
ask = "What does this import make available?"
concepts = ["go.import"]
notes = { "go.import" = "`math` brings `Sqrt` and the rest of the package in under the name `math`." }

[[blocks]]
lines = [3, 6]
ask = "How many fields does `Point` have, and what are their types?"
concepts = ["go.struct.define"]
notes = { "go.struct.define" = "Two fields, both `float64`: `X, Y float64` is shorthand for two declarations." }

[[blocks]]
lines = [7, 9]
ask = "What does the `(p Point)` part do, and what does it mean for the caller?"
concepts = ["go.method.receiver", "go.value.semantics"]
notes = { "go.method.receiver" = "It makes `Dist` a method on `Point`; a value receiver means `p` is a copy of the struct at the call.", "go.value.semantics" = "With a value receiver the method works on a copy, so it cannot change the caller's Point — fine here, since it only reads." }
