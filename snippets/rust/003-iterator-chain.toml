id = "rust-003"
language = "rust"
title = "Iterator adaptors: a filter/map/collect chain"
source = "idiomatic Rust over a slice of records"
intro = "A filter/map/collect chain that pulls the error messages out of a slice of log lines."

code = '''
#[derive(Debug)]
struct LogLine {
    level: &'static str,
    message: String,
}

fn errors(lines: &[LogLine]) -> Vec<String> {
    lines
        .iter()
        .filter(|line| line.level == "ERROR")
        .map(|line| line.message.clone())
        .collect()
}
'''

[[blocks]]
lines = [1, 6]
ask = "What does `derive(Debug)` generate, and why is `level` a `&'static str` while `message` is a `String`?"
concepts = ["rust.struct", "rust.derive", "rust.lifetime.static"]
notes = { "rust.struct" = "A struct groups named fields into one type; each field has its own type.", "rust.derive" = "`#[derive(Debug)]` generates `impl Debug for LogLine`, which is what `{:?}` needs.", "rust.lifetime.static" = "`&'static str` borrows text that lives for the whole program — string literals are exactly that; `String` is owned instead, because the message is built at runtime." }

[[blocks]]
lines = [7, 10]
ask = "What is `&[LogLine]` as a parameter, and what does `filter` do to the chain before `map` runs?"
concepts = ["rust.slice", "rust.iterator.lazy", "rust.closure"]
notes = { "rust.slice" = "`&[LogLine]` is a borrowed view of a contiguous run of records: no copy, no ownership transfer, and it works with arrays and `Vec`s alike.", "rust.iterator.lazy" = "Adaptors are lazy: nothing is filtered or mapped until a consumer (`collect`) drives the iterator.", "rust.closure" = "`|line| ...` is an anonymous function; here it borrows `level` and `message` through `line`." }

[[blocks]]
lines = [11, 13]
ask = "What type does `collect` produce, and why is `clone` needed inside `map`?"
concepts = ["rust.iterator.adaptor", "rust.collect", "rust.ownership.clone"]
notes = { "rust.iterator.adaptor" = "`map` transforms each surviving element; `filter` and `map` are adaptors that return a new iterator, not a collection.", "rust.collect" = "`collect` consumes the iterator into a collection; here the return type `Vec<String>` tells it what to build.", "rust.ownership.clone" = "`lines` is borrowed, so the `String` inside cannot be moved out — `clone` allocates a new owned `String` per kept line." }
