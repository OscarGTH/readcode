  concepts = ["rust.iterator.for"]
  notes = { "rust.iterator.for" = "`for` drives an iterator; `split_whitespace()` yields each word as a `&str` slice of `text`." }

[[blocks]]
lines = [6, 7]
ask = "Break this line down. What does each part do?"
concepts = ["rust.hashmap.entry", "rust.deref.assign"]
notes = { "rust.hashmap.entry" = "`entry(word)` looks the key up once; `or_insert(0)` inserts a default 0 when it is absent and returns a slot either way.", "rust.deref.assign" = "`or_insert` hands back `&mut usize`; the `*` dereferences it so `+= 1` writes the count, not the reference." }
  [[blocks.line]]
  at = 6
  ask = "What do the `*`, `entry` and `or_insert` do here?"
  concepts = ["rust.hashmap.entry", "rust.deref.assign"]
  notes = { "rust.hashmap.entry" = "`entry(word)` looks the key up once; `or_insert(0)` inserts a default 0 when the key is absent and hands back the slot either way.", "rust.deref.assign" = "`or_insert` returns a `&mut usize`; the `*` reaches the integer behind it, so `+= 1` writes the count. Without the `*` you would be assigning to a reference." }

