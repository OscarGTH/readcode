ask = "Why must `counts` be mutable? What does the loop iterate over?"
concepts = ["rust.binding.mut", "rust.iterator.for"]
notes = { "rust.binding.mut" = "`mut` is required because the loop inserts into the map; without it every `insert` would be a compile error.", "rust.iterator.for" = "`for` drives an iterator: `split_whitespace()` yields each word as a `&str` slice of `text`." }
  [[blocks.line]]
