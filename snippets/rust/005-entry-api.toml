id = "rust-005"
language = "rust"
title = "Counting words with the entry API"
source = "the shape of every word-count in Rust"
intro = "Counting words with the `entry` API — every line does something different."
levels = [3, 3]

code = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<&str, usize> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        *counts.entry(word).or_insert(0) += 1;
    }
    counts
}
'''

[[blocks]]
lines = [1, 2]
ask = "Why does `HashMap` need a `use` here, but `String` and `Vec` do not?"
concepts = ["rust.use.prelude"]
notes = { "rust.use.prelude" = "The prelude is the small set of names every Rust file gets for free — `String`, `Vec`, `Option`, `Result`. `HashMap` is not in it, so it has to be named explicitly." }
  [[blocks.line]]
  at = 1
  ask = "Why does `HashMap` need a `use` here, but `String` and `Vec` do not?"
  concepts = ["rust.use.prelude"]
  notes = { "rust.use.prelude" = "`String` and `Vec` come from the prelude; `HashMap` does not, so the file has to import it by hand." }

[[blocks]]
lines = [3, 3]
ask = "What does this signature return? Where does the key's lifetime come from?"
concepts = ["rust.fn.return", "rust.lifetime.elision"]
notes = { "rust.fn.return" = "It returns a map from a word to how many times it appeared; `usize` is the count.", "rust.lifetime.elision" = "The returned `&str` keys borrow from `text`, so the map cannot outlive the input; the lifetime is elided, not absent." }
  [[blocks.line]]
  at = 3
  ask = "Where does the returned map's lifetime come from? What breaks if `text` is dropped?"
  concepts = ["rust.lifetime.elision"]
  notes = { "rust.lifetime.elision" = "The compiler gives the returned map the same lifetime as `text`, so using it after `text` dies is a compile error." }

[[blocks]]
