id = "rust-005"
language = "rust"
title = "Counting words with the entry API"
source = "the shape of every word-count in Rust"
intro = "Five lines, four ideas. This one is asked line by line, because each line hides something."

code = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<&str, usize> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        *counts.entry(word).or_insert(0) += 1;
    }
    counts
}
'''

[[blocks]]
lines = [1, 2]
ask = "What does this import bring into scope?"
concepts = ["rust.use.import"]
notes = { "rust.use.import" = "`use` brings `HashMap` into scope, so the rest of the file writes `HashMap` instead of `std::collections::HashMap`." }

[[blocks]]
lines = [3, 3]
ask = "What does this signature promise, and where does the key's lifetime come from?"
concepts = ["rust.fn.return", "rust.lifetime.elision"]
notes = { "rust.fn.return" = "It returns a map from a word to how many times it appeared; `usize` is the count.", "rust.lifetime.elision" = "The returned `&str` keys borrow from `text`, so the map cannot outlive the input; the lifetime is elided, not absent." }
  [[blocks.line]]
  at = 3
  ask = "Where does the lifetime of the returned map come from — and what breaks if `text` is dropped?"
  concepts = ["rust.lifetime.elision"]
  notes = { "rust.lifetime.elision" = "The compiler gives the returned map the same lifetime as `text`, so using it after `text` dies is a compile error." }

[[blocks]]
lines = [4, 5]
ask = "Why is `counts` mutable, and what does the `for` loop iterate over?"
concepts = ["rust.binding.mut", "rust.iterator.for"]
notes = { "rust.binding.mut" = "`mut` is required because the loop inserts into the map; without it every `insert` would be a compile error.", "rust.iterator.for" = "`for` drives an iterator: `split_whitespace()` yields each word as a `&str` slice of `text`." }

[[blocks]]
lines = [6, 7]
ask = "Unpack `*counts.entry(word).or_insert(0) += 1;` — what does each part do?"
concepts = ["rust.hashmap.entry", "rust.deref.assign"]
notes = { "rust.hashmap.entry" = "`entry(word)` looks the key up once; `or_insert(0)` inserts a default 0 when it is absent and returns a slot either way.", "rust.deref.assign" = "`or_insert` hands back `&mut usize`; the `*` dereferences it so `+= 1` writes the count, not the reference." }
  [[blocks.line]]
  at = 6
  ask = "Unpack this line: the `*`, the `entry`, and the `or_insert`."
  concepts = ["rust.hashmap.entry", "rust.deref.assign"]
  notes = { "rust.hashmap.entry" = "`entry(word)` looks the key up once; `or_insert(0)` inserts a default 0 when the key is absent and hands back the slot either way.", "rust.deref.assign" = "`or_insert` returns a `&mut usize`; the `*` reaches the integer behind it, so `+= 1` writes the count. Without the `*` you would be assigning to a reference." }

[[blocks]]
lines = [8, 9]
ask = "What is returned here, and why is there no `return` keyword?"
concepts = ["rust.return.value"]
notes = { "rust.return.value" = "`counts` is the tail expression: the value is moved out as the return value, which is why it has no semicolon." }
