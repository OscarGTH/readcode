id = "rust-007"
language = "rust"
title = "One decision, two answers"
level = 1
intro = "A function that returns one of two literals, with no `return` anywhere."
code = '''
fn label(n: i32) -> &'static str {
    if n % 2 == 0 {
        "even"
    } else {
        "odd"
    }
}
'''

[[blocks]]
lines = [1, 1]
ask = "What does `'static` promise about the returned text? Why does a literal qualify?"
concepts = ["rust.lifetime.static"]
notes = { "rust.lifetime.static" = "`&'static str` is a borrow that is valid for the whole program. A literal is compiled into the binary, so it does — while a `String` built at runtime could not be returned this way." }

[[blocks]]
lines = [2, 7]
ask = "There is no `return` and no semicolon. Where do the two values go? What must match?"
concepts = ["rust.if.expr", "rust.if.arms.type"]
notes = { "rust.if.expr" = "`if` is an expression: each block's last expression is its value, and the whole `if` is the tail expression of the function.", "rust.if.arms.type" = "Both arms must produce the same type — two `&'static str` here. An arm that produced a `String` would be a compile error, not a coercion." }
