id = "rust-009"
language = "rust"
title = "Adding up a range"
level = 2
intro = "A loop that accumulates a running total, and returns it."
code = '''
fn total(limit: u32) -> u32 {
    let mut sum = 0;
    for n in 1..=limit {
        sum += n;
    }
    sum
}
'''

[[blocks]]
lines = [1, 1]
ask = "What does the function promise, and what is `u32`?"
concepts = ["rust.fn.return", "rust.type.u32"]
notes = { "rust.fn.return" = "It takes a `u32` and returns a `u32`.", "rust.type.u32" = "`u32` is an unsigned 32-bit integer: whole numbers only, never negative." }

[[blocks]]
lines = [2, 5]
ask = "What is the loop doing to `sum`, step by step?"
concepts = ["rust.binding.mut", "rust.range.inclusive", "rust.iterator.for", "rust.operator.compound"]
notes = { "rust.binding.mut" = "`mut` is required because `sum` is reassigned inside the loop.", "rust.range.inclusive" = "`1..=limit` includes `limit`; `1..limit` would stop one short.", "rust.iterator.for" = "`for` takes an iterator — here a range — and runs the body once per item.", "rust.operator.compound" = "`sum += n` is shorthand for `sum = sum + n`." }

[[blocks]]
lines = [6, 7]
ask = "Why is there no `return` on the last line?"
concepts = ["rust.return.value"]
notes = { "rust.return.value" = "`sum` is the tail expression, so its value is the return value; a semicolon would make it `()`." }
