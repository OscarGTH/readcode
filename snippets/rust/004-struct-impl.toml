id = "rust-004"
language = "rust"
title = "A struct with behaviour: impl, &mut self and a loop"
source = "the shape of most small Rust types"
intro = "A struct with one mutating method, driven by a loop that checks its return value."
levels = [2, 3]

code = '''
#[derive(Default)]
struct Counter {
    hits: u32,
}

impl Counter {
    fn hit(&mut self) -> bool {
        self.hits += 1;
        self.hits >= 3
    }
}

fn main() {
    let mut counter = Counter::default();
    while !counter.hit() {
        println!("{} hit(s)", counter.hits);
    }
}
'''

[[blocks]]
lines = [1, 5]
ask = "What does `#[derive(Default)]` let `main` call that this struct never writes?"
concepts = ["rust.struct", "rust.derive", "rust.type.u32"]
notes = { "rust.struct" = "`Counter` is a named type with a single field, `hits`.", "rust.derive" = "`#[derive(Default)]` generates `impl Default for Counter`, which yields `Counter { hits: 0 }`.", "rust.type.u32" = "`u32` is an unsigned 32-bit integer: no negative values, and the struct's size is just that field's four bytes." }

[[blocks]]
lines = [6, 11]
ask = "What does `&mut self` let `hit` do to the counter it is called on?"
concepts = ["rust.impl", "rust.mut_self", "rust.return.bool", "rust.operator.compound"]
notes = { "rust.impl" = "`impl Counter` attaches methods to the type; `Counter::default()` and `counter.hit()` both come from impls.", "rust.mut_self" = "`&mut self` takes an exclusive borrow of the value, which is the only way a method may write to `self.hits` — and it forces the caller's binding to be `mut`.", "rust.return.bool" = "The last expression `self.hits >= 3` is the return value; there is no `return` keyword and no semicolon.", "rust.operator.compound" = "`+=` is compound assignment: read `hits`, add one, write it back — the same as `self.hits = self.hits + 1`." }

[[blocks]]
lines = [12, 18]
ask = "What does `!counter.hit()` mean to the loop while the count is under three?"
concepts = ["rust.binding.mut", "rust.loop.while", "rust.method.call", "rust.operator.not"]
notes = { "rust.binding.mut" = "`hit` takes `&mut self`, so the binding must be `let mut`; `Default::default()` cannot be called on an immutable binding here.", "rust.loop.while" = "`while` evaluates the condition before each iteration and stops when it is `false`.", "rust.method.call" = "`counter.hit()` calls the inherent method with `&mut counter` as the receiver; the return value is used directly as the condition.", "rust.operator.not" = "`!` inverts the `bool`: the loop keeps running while `hit()` returns `false`." }
